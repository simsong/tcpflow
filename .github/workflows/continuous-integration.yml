# Validate main updates and every PR, including draft PRs and fork changes.
# Reusable checks are also called by the release workflow at its exact commit.
# Branch pushes with an open PR do not create a duplicate native build matrix.
# Windows and Snap jobs test their actual downloadable package formats.
# No signing or publication privilege is granted to pull-request code.
name: tcpflow CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    secrets: inherit
  windows:
    uses: ./.github/workflows/windows.yml
  snap:
    uses: ./.github/workflows/snap.yml
