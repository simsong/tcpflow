<?xml version="1.0"?>
<!-- Configure fonts bundled with tcpflow's strictly confined Snap.
     Cairo loads this file through the app's FONTCONFIG_FILE setting.
     The font directory is relative to this file, independent of revision.
     Cache files go to the writable XDG cache directory supplied by Snap.
     This avoids relying on the host's font configuration or font paths. -->
<fontconfig>
  <dir prefix="relative">../../usr/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias>
    <family>Sans</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
</fontconfig>
